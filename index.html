<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Árvores Frutíferas - Prado BA</title>
    
    <!-- CSS do Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { height: 100vh; width: 100%; }
        .instrucoes {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 10px; border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            max-width: 240px;
        }
    </style>
</head>
<body>

    <div class="instrucoes">
        <h4>Pomar Urbano: Prado</h4>
        <p>Clique no mapa para adicionar o local de uma árvore frutífera.</p>
        <p>Os dados são salvos no servidor e ficam disponíveis para todos os usuários.</p>
    </div>

    <div id="map"></div>

    <!-- JS do Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // 1. Centralizar o mapa em Prado, Bahia
        const map = L.map('map').setView([-17.3411, -39.2208], 15);

        // 2. Adicionar camada de mapa (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Função para buscar árvores do servidor
        async function fetchTrees() {
            try {
                const res = await fetch('/api/trees');
                if (!res.ok) throw new Error('Falha ao carregar árvores');
                const trees = await res.json();
                return trees;
            } catch (err) {
                console.error(err);
                return [];
            }
        }

        // Renderizar marcadores a partir de dados
        async function renderTrees() {
            const trees = await fetchTrees();
            trees.forEach(t => {
                const marker = L.marker([t.lat, t.lng]).addTo(map);
                const userInfo = t.user ? `<br><small>Adicionado por: ${t.user}</small>` : '';
                marker.bindPopup(`<b>${t.fruta}</b>${userInfo}`);
            });
        }

        // 3. Função para adicionar novos locais ao clicar
        async function onMapClick(e) {
            const fruta = prompt("Qual árvore frutífera existe aqui? (Ex: Pitangueira, Coqueiro)");
            if (!fruta) return;
            const user = prompt('Seu nome (opcional) para identificar a contribuição:');

            const payload = { lat: e.latlng.lat, lng: e.latlng.lng, fruta, user };

            try {
                const res = await fetch('/api/trees', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error('Erro ao salvar');
                const saved = await res.json();
                const novoMarcador = L.marker([saved.lat, saved.lng]).addTo(map);
                const userInfo = saved.user ? `<br><small>Adicionado por: ${saved.user}</small>` : '';
                novoMarcador.bindPopup(`<b>${saved.fruta}</b>${userInfo}`).openPopup();
            } catch (err) {
                alert('Não foi possível salvar a árvore no servidor. Tente novamente.');
                console.error(err);
            }
        }

        map.on('click', onMapClick);

        // Inicializa marcadores do servidor
        renderTrees();
    </script>
</body>
</html>
